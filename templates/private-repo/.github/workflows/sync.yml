# Larkwell 私有内容仓库 - 语雀同步工作流
# 作用：定时从语雀拉取最新文档，提交到私有仓库
# 触发：每日凌晨 3 点（北京时间）、手动触发、push 到 main
name: Sync from Yuque

on:
  schedule:
    - cron: '0 19 * * *'  # UTC 19:00 = 北京时间次日 03:00
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'elog.config.cjs'
      - 'elog.format.cjs'
      - 'package.json'
      - '.github/workflows/sync.yml'

permissions:
  contents: write  # 提交同步内容需要

# 解决 Node.js 20 弃用告警：允许 GitHub Actions JavaScript 运行时默认使用 Node 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # 私有仓库内容轻量，优先用 npm install（避免 lockfile 缺失/不一致报错）
        run: npm install --no-audit --no-fund

      - name: Elog sync (从语雀拉取文档)
        env:
          YUQUE_TOKEN: ${{ secrets.YUQUE_TOKEN }}
          YUQUE_LOGIN: yuqueyonghu-dg6ehw
          YUQUE_REPO: slk2dt
        run: npm run elog:sync

      - name: Debug - list synced files
        # 调试用：打印 docs/ 和 images/ 目录的实际内容
        run: |
          echo "--- docs/ 目录 ---"
          if [ -d docs ]; then
            find docs -type f | head -30
            echo "总文件数: $(find docs -type f | wc -l)"
          else
            echo "docs/ 目录不存在"
          fi
          echo "--- images/ 目录 ---"
          if [ -d images ]; then
            find images -type f | head -10
            echo "总文件数: $(find images -type f | wc -l)"
          else
            echo "images/ 目录不存在"
          fi

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 安全 add：即使目录为空或不存在也不报错（--ignore-errors + pathspec ':'）
          git add -A docs/ images/ 2>/dev/null || true
          # 用 git status 判断是否有变更，而不是依赖 diff --staged（避免空仓库报错）
          if git status --porcelain | grep -qE '^[AMRD]'; then
            git commit -m "chore(content): sync from yuque $(date -u +'%Y-%m-%d %H:%M')"
            git push
            echo "✅ 已提交并推送新内容"
          else
            echo "ℹ️  没有新的内容需要提交（docs/ 可能为空或与远端一致）"
          fi

      - name: Trigger public repo deploy
        # 私有仓库同步完成后，触发公共仓库重新构建部署
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        if: env.DISPATCH_TOKEN != ''
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            https://api.github.com/repos/Yixi233-mo/Larkwell/dispatches \
            -d '{"event_type":"content-updated"}'
